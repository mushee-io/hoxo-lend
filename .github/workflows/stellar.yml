name: Stellar-native Soroban checks

on:
  push:
    branches: [main, feature/soroban-full-protocol-port]
  pull_request:

permissions:
  contents: read

jobs:
  stellar-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
    strategy:
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify Stellar-only site and configuration
        run: |
          set -euo pipefail
          node --check src/stellar.js
          node scripts/check-stellar.mjs
          git diff --check

      - name: Install Rust toolchain and formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            soroban
            soroban/oracle
            soroban/rate-model
            soroban/rwa

      - name: Enforce formatting for all active Soroban crates
        run: |
          set -euo pipefail
          for pkg in soroban soroban/oracle soroban/rate-model soroban/rwa; do
            cargo fmt --manifest-path "$pkg/Cargo.toml" --check
          done

      - name: Execute Soroban contract tests
        run: |
          set -euo pipefail
          for pkg in soroban soroban/oracle soroban/rate-model soroban/rwa; do
            echo "::group::Testing $pkg"
            cargo test --manifest-path "$pkg/Cargo.toml"
            echo "::endgroup::"
          done
