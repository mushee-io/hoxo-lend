[package]
name = "hoxo-lend-lens"
version = "0.1.0"
edition = "2021"
publish = false
description = "Read-only Soroban market snapshots for Stellar native clients"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "=29.0.1"

[dev-dependencies]
soroban-sdk = { version = "=29.0.1", features = ["testutils"] }
