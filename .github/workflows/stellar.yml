name: Stellar foundation checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: write
jobs:
  frontend-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fail closed on wrong-network configuration
        run: |
          node --check src/stellar.js
          node --check src/v2.js
          node scripts/check-v2.mjs
          node scripts/check-stellar.mjs
          git diff --check
      - name: Bundle and test official Stellar SDK / Freighter browser transaction client
        shell: bash
        run: |
          set -euo pipefail
          node --check src/tx-live.js
          bash -n scripts/activate-testnet-vault.sh
          npm install --no-audit --no-fund
          npm run test:frontend
          npm run build
          test -s dist/src/tx-live.bundle.js
          test -s dist/app/supply/index.html
          test -s dist/config/stellar-testnet.json
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Rust formatting
        run: cargo fmt --manifest-path soroban/Cargo.toml --check
      - name: Rust tests
        run: cargo test --manifest-path soroban/Cargo.toml
      - name: Publish static Freighter signing bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/src/tx-live.bundle.js
          cp dist/src/tx-live.bundle.js src/tx-live.bundle.js
          test -s src/tx-live.bundle.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tx-live.bundle.js
          if git diff --cached --quiet; then
            echo "Freighter bundle already matches compiled version"
            exit 0
          fi
          git commit -m "Publish verified Freighter signing bundle for Vercel static hosting [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
